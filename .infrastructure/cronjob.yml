apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cronjob
  namespace: todoapp
spec:
  schedule: "*/4 * * * *"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: busybox-curl
              image: yurakolam/busyboxplus:curl
              imagePullPolicy: Always
              command: ["/bin/sh", "-c", "curl -s http://todoapp/api/health"]
              resources:
                requests:
                  cpu: "100m"
                  memory: "100Mi"
                limits:
                  cpu: "200m"
                  memory: "200Mi"
          restartPolicy: OnFailure
